[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "source-to-grounded-skill"
version = "2.0.0"
description = "Provenance-preserving scholarly knowledge compiler: convert books and documents into grounded, reviewable agent skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# PyYAML powers domain profiles and structure maps; the rest of the
# pipeline stays stdlib-only like upstream.
dependencies = ["pyyaml"]

[project.scripts]
book-to-skill = "book_to_skill.cli:main"
source-to-skill = "book_to_skill.cli:main"

[project.optional-dependencies]
epub = ["ebooklib", "beautifulsoup4"]
pdf = ["pypdf", "pdfminer.six"]
docx = ["python-docx"]
rtf = ["striprtf"]
technical = ["docling"]
all = [
    "ebooklib",
    "beautifulsoup4",
    "pypdf",
    "pdfminer.six",
    "python-docx",
    "striprtf",
    "docling"
]


# Tooling config so `ruff check .` and `pytest` locally match CI without flags.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# High-value gate only: syntax errors (E9) + pyflakes (F). Style stays ungated.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
